name: Verify Reserve
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  booking-acceptance:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RESERVE_DEV_PREVIEW: 'true'
      RESERVE_BOOKING_EMAIL_ENABLED: 'false'
      RESERVE_BOOKING_CRON_ENABLED: 'false'
      APP_ORIGIN: http://localhost:3000
      AXE_CORE_PATH: /tmp/aethelios-a11y/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select the installed Chromium executable
        run: node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log("CHROMIUM_PATH="+chromium.executablePath())' >> "$GITHUB_ENV"
      - run: npm install --prefix /tmp/aethelios-a11y --no-save --package-lock=false axe-core@4.11.0
      - name: Disposable PostgreSQL concurrency acceptance
        run: |
          set -e
          docker run --name katie-first-booking-postgres --tmpfs /var/lib/postgresql/data -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=katie_isolated -p 127.0.0.1:55439:5432 -d postgres:17
          trap 'docker rm -f katie-first-booking-postgres' EXIT
          for attempt in $(seq 1 30); do
            if docker exec katie-first-booking-postgres pg_isready -U postgres -d katie_isolated; then break; fi
            sleep 1
          done
          npm run verify:katie-postgres
      - name: Isolated booking, staff, privacy and founder browsers
        run: |
          set -e
          for suite in browser booking-pilot chair provider-brands founder-command founder-foundation booking-operations operations katie-launch katie-closed katie-calendar-gate; do
            npm run preview:reset
            npm run "verify:$suite"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-acceptance-${{ github.sha }}
          path: artifacts/
          retention-days: 7

name: Verify live Fix It Shop
on:
  push:
    branches: [release/fix-it-live-verification]
permissions:
  contents: read
jobs:
  live-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-fix-it-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix-it-live-production
          path: artifacts/live-production/
          retention-days: 7
